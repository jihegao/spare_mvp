name: spare-mvp-desktop-rc1

services:
  initializer:
    image: ${SPARE_IMAGE:?SPARE_IMAGE is required}
    command:
      - python
      - scripts/initialize-case-database.py
      - --database
      - /data/spare_mvp.sqlite3
      - --if-missing
    volumes:
      - spare-data:/data
    restart: "no"

  backend:
    image: ${SPARE_IMAGE:?SPARE_IMAGE is required}
    command:
      - python
      - -m
      - src.spare_mvp_backend.http_server
      - --host
      - 0.0.0.0
      - --port
      - "4173"
      - --repo-root
      - /opt/spare
      - --database
      - /data/spare_mvp.sqlite3
      - --output-dir
      - /exports/results
    ports:
      - 127.0.0.1:${SPARE_BACKEND_PORT:?SPARE_BACKEND_PORT is required}:4173
    volumes:
      - spare-data:/data
      - type: bind
        source: ${SPARE_EXPORT_DIR:?SPARE_EXPORT_DIR is required}
        target: /exports
    depends_on:
      initializer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/_spare_mvp/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    restart: unless-stopped

  solara:
    image: ${SPARE_IMAGE:?SPARE_IMAGE is required}
    command:
      - python
      - -m
      - solara
      - run
      - src.spare_mvp_abm.aircraft_support_v1.solara_app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --production
      - --no-open
    environment:
      SPARE_MVP_SOLARA_BACKEND_API_BASE: http://backend:4173/api
    ports:
      - 127.0.0.1:${SPARE_SOLARA_PORT:?SPARE_SOLARA_PORT is required}:8765
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 25s
    restart: unless-stopped

volumes:
  spare-data:
    name: spare-mvp-desktop-rc1-data
